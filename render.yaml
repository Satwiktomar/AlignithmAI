databases:
  - name: rolefit-db
    plan: free
    databaseName: rolefit
    user: rolefit

services:
  - type: web
    name: rolefit-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rolefit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ML_SERVICE_URL
        fromService:
          name: rolefit-ml
          type: web
          property: hostport
      - key: ALLOWED_ORIGINS
        value: "https://rolefit-frontend.onrender.com"
      - key: ENVIRONMENT
        value: production
      - key: ML_INTERNAL_KEY
        generateValue: true
      - key: OLLAMA_MODEL
        value: mistral
      - key: PYTHON_VERSION
        value: "3.11.0"

  - type: web
    name: rolefit-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    rootDir: ml
    envVars:
      - key: ALLOWED_ORIGINS
        fromService:
          name: rolefit-backend
          type: web
          property: hostport
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ML_INTERNAL_KEY
        fromService:
          name: rolefit-backend
          type: web
          envVarKey: ML_INTERNAL_KEY
      - key: HF_HOME
        value: /tmp/hf_cache
      - key: TOKENIZERS_PARALLELISM
        value: "false"

  - type: web
    name: rolefit-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    healthCheckPath: /_stcore/health
    rootDir: frontend
    envVars:
      - key: BACKEND_URL
        fromService:
          name: rolefit-backend
          type: web
          property: hostport
      - key: PYTHON_VERSION
        value: "3.11.0"
